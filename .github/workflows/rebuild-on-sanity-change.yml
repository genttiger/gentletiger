name: Rebuild when Sanity content changes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanity-content-rebuild
  cancel-in-progress: false

jobs:
  detect-content-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read latest Sanity article version
        id: sanity
        shell: bash
        run: |
          set -euo pipefail
          latest_version=$(node <<'NODE'
          const projectId = 'xxan1l35'
          const dataset = 'production'
          const query = '*[_type == "article"] | order(_updatedAt desc)[0]._updatedAt'
          const url = new URL(`https://${projectId}.api.sanity.io/v2025-01-01/data/query/${dataset}`)
          url.searchParams.set('query', query)
          const response = await fetch(url, {headers: {accept: 'application/json'}})
          if (!response.ok) throw new Error(`Sanity query failed: HTTP ${response.status}`)
          const payload = await response.json()
          if (!payload.result) throw new Error('Sanity returned no article version')
          process.stdout.write(payload.result)
          NODE
          )
          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Compare with deployed content version
        id: compare
        shell: bash
        env:
          LATEST_VERSION: ${{ steps.sanity.outputs.latest_version }}
        run: |
          set -euo pipefail
          current_version=''
          if [[ -f .sanity-content-version ]]; then
            current_version=$(tr -d '\r\n' < .sanity-content-version)
          fi

          if [[ "$LATEST_VERSION" == "$current_version" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Sanity content is unchanged: $LATEST_VERSION"
          else
            printf '%s\n' "$LATEST_VERSION" > .sanity-content-version
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Sanity content changed: $current_version -> $LATEST_VERSION"
          fi

      - name: Commit content version to trigger Cloudflare Pages
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'gentletiger-content-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .sanity-content-version
          git commit -m "Rebuild for Sanity content update [skip actions]"
          git push origin HEAD:main
